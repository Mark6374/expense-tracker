[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-tracker"
version = "0.1.0"
description = "Simple command-line expense tracker"
requires-python = ">=3.10"

[project.scripts]
expense-tracker = "expense_tracker.cli:main"

[tool.setuptools]
packages = ["expense_tracker"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
# Declared explicitly so lint results do not depend on any user-level ruff config.
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
files = ["expense_tracker"]
